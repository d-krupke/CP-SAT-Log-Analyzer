# Optional local hygiene hooks (`pre-commit install`). Kept deliberately small:
# the real checks live in .github/workflows/ci.yml, which runs each project with
# its own tooling. The excludes matter - the log corpora are verbatim solver
# output and must never be reformatted or spell-corrected.
ci:
  autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"

exclude: '^(example_logs/|corpus/|frontend/dist/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: [--fix]
        files: '^(cpsatlog|backend)/'
      - id: ruff-format
        files: '^(cpsatlog|backend)/'

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        exclude: '^(LICENSE$|knowledge/parameters\.toml$)'
