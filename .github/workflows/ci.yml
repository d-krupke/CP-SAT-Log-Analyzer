# CI for the three projects: the parser library, the backend and the frontend are
# checked independently, each with the tooling it is developed with (uv for the
# Python parts, npm for the frontend). The weekly run additionally upgrades
# OR-Tools to its newest release, which is how a changed log format shows up
# here before a user reports it.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * FRI"

jobs:
  cpsatlog:
    name: parser library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cpsatlog
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Upgrade OR-Tools (weekly run only)
        if: github.event_name == 'schedule'
        run: uv sync --all-groups --upgrade-package ortools
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check .
      - run: uv run pytest -q
      # The lock file resolves to the newest pydantic, so a wrong lower bound in
      # pyproject.toml stays invisible until a user pins an older one. Run the
      # suite against the floor we advertise as well. test_latest_version.py is
      # excluded because it asserts the *newest* OR-Tools, which is the opposite
      # question.
      - name: Tests against the oldest supported dependencies
        run: |
          uv run --isolated --resolution lowest-direct --group dev \
            pytest -q --ignore=tests/test_latest_version.py
      # The package advertises 3.13 in its classifiers, so something has to run it.
      - name: Tests on Python 3.13
        run: |
          uv run --isolated --python 3.13 --group dev \
            pytest -q --ignore=tests/test_latest_version.py

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check .
      - run: uv run pytest -q
      - name: Knowledge base loads
        run: uv run python -m app.knowledge

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
