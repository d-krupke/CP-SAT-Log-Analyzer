# Curated one-line descriptions of the bundled example logs (example_logs/<name>.txt).
#
# `[examples]` is what the landing page offers. The set is deliberately small and
# chosen for diversity: each entry differs from the others in problem type, status,
# portfolio shape, presolve effect or constraint family, so that clicking through them
# shows different log anatomies rather than the same run in ten sizes.
#
# `[archived]` describes example_logs/archive/: logs retired from that list (older
# OR-Tools versions, redundant parameter variants). They are not served by the API but
# the test suites still parse them, and they are the only samples of the 9.3 ... 9.10
# formats. To bring one back, move the file up one directory and its entry into
# `[examples]`.

[examples]
915_01 = '''
Knapsack with integer quantities and an AllDifferent side constraint: a small, quick
optimization run - the best log to read first.'''
915_jobshop_8workers = '''
Job-shop scheduling (ta61) with the default 8-worker portfolio: 219 improving solutions, most
of them from the LNS neighborhoods, and the 60 s limit stops the run with a small gap left.'''
915_jobshop_1worker = '''
One worker on a job-shop instance (la26): a single `main` subsolver with exactly your
parameters - no portfolio, no LNS, no first-solution helpers, and 157 solutions found by that
one worker alone.'''
915_sudoku_shared_tree = '''
16x16 Sudoku with 16 workers: enough workers for CP-SAT to enable shared-tree search
("Setting number of shared tree workers to 6"), and a `shared_tree` worker finds the
solution.'''
915_setcover_lns_only = '''
`use_lns_only` on a set-covering instance: no exact worker runs, 22 subsolvers are filtered
out and the bound never leaves 0 - good solutions, no proof.'''
915_coloring_objective_fixed = '''
Graph coloring where presolve pins the objective to 11 colors: the portfolio then has no
objective workers (`core`, `pseudo_costs`, ...) and no LNS at all, only feasibility work.'''
915_qap_presolve_blowup = '''
QAP with `linearization_level=0` where presolve expands 1,275 variables (AllDifferent plus
1,225 element constraints) into 3 million Booleans and eats the whole time limit - the search
never starts, so the log has no statistics tables at all.'''
915_langford_infeasible = '''
Langford pairing L(2,18), proven infeasible immediately - and a case where the presolved model
is *larger* than the initial one because AllDifferent is expanded into Booleans.'''
915_nqueens_time_limit = '''
500 queens as a pure satisfaction problem: no solution within 60 s (UNKNOWN), so all the
difficulty is feasibility rather than optimization.'''
915_minizinc_radiation = '''
A FlatZinc model (MiniZinc Challenge `radiation`) solved through the `cp-sat` backend: presolve
removes two thirds of the 47,213 variables, then LNS produces 57 improving solutions.'''

[archived]
915_jobshop_16workers = '''
The la26 instance with 16 workers: 11 full subsolvers plus the LNS helpers close it in 0.4 s.
Retired because its portfolio looks like the 8-worker log's.'''
915_jobshop_interleaved = '''
`interleave_search`: the header says "deterministic search", the full-worker roster is no
longer truncated to the worker count, and the workers without a chunked implementation are
missing.'''
915_langford_enumerate_all = '''
`enumerate_all_solutions`: 376 solutions of L(2,8) are enumerated, so the log has many `#N`
events but no objective and no bound.'''
915_mknapsack_no_presolve = '''
`cp_model_presolve=false` on a multi-knapsack: the presolved model is identical to the initial
one and the search has to work on the raw formulation.'''
910_01 = '''
OR-Tools 9.10 asked for a 1% gap (`relative_gap_limit`) but the 30 s time limit came first, so
the run ends FEASIBLE with the gap still open.'''
