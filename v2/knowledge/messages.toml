# Explanations of free-form solver messages. Keys are the message kinds the
# parser assigns (see v2/cpsatlog/src/cpsatlog/parsers/messages.py).

[messages]
closed_by_presolve = 'Presolve proved optimality or infeasibility, so no search ran.'
gap_limit_reached = '''
The solver stopped because the objective/bound gap fell below `relative_gap_limit` /
`absolute_gap_limit`. CP-SAT then reports the status **OPTIMAL** although the gap is not
zero; check `best_bound` in the response for the remaining gap.'''
loading_model = '''
The presolved model is being loaded into the workers (older versions; newer ones print
`Preloading model.` at the end of presolve instead).'''
hint = '''
Information about the solution hint (whether it was complete/feasible and which objective it
had).'''
infeasible = 'The model was proven infeasible.'
interleave_batch_size = '''
`interleave_search` is on and `interleave_batch_size` was left at 0, so the solver picked the
batch size itself: `num_workers * 3` (1 with a single worker). The portfolio then runs in
synchronised batches, which makes the run deterministic but leaves each worker less
uninterrupted time.'''
legacy_subsolver_stats = '''
Per-worker statistics dump of an old OR-Tools version (newer versions print tables instead).'''
