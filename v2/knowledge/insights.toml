# Insights: the colored boxes in the Overview card. The *logic* that decides
# whether an insight fires lives in v2/backend/app/insights.py; this file holds
# everything a CP-SAT expert may want to tune: the thresholds, the level
# (info | good | warn | bad), the title and the text.
#
# Texts are Markdown. Values computed by the rule are inserted with Python
# format fields, e.g. {gap:.2f}; the available fields are listed per rule.

[solved_by_presolve]
level = 'good'
title = 'Solved by presolve'
text = '''
Presolve alone settled the model; no search was needed. The search statistics are therefore
empty.'''

[not_proven_optimal]      # fields: gap (percent)
level = 'warn'
title = 'Not proven optimal'
text = '''
The solver stopped with a gap of {gap:.2f}%. Either the incumbent is not optimal or the bound
could not be raised. Check whether solutions or bounds stalled last (progress plot) to decide
between more time, better hints/LNS, or a stronger formulation for the relaxation.'''

[no_solution]
level = 'bad'
title = 'No solution found'
text = '''
The solver found no feasible solution within the limits. Try a hint, a longer time limit, or
check the model for very tight constraints.'''

[infeasible]
level = 'info'
title = 'Model proven infeasible'
text = '''
Infeasibility was proven. Check the presolve log: often a fixed variable or a domain that
presolve emptied reveals the conflicting constraints.'''

[solutions_stalled]       # fields: last_time, wall
fraction_of_walltime = 0.5   # fires when the last improving solution came before this share of the wall time
level = 'info'
title = 'Solutions stalled early'
text = '''
The last improving solution was found at {last_time:.1f}s of {wall:.1f}s. The remaining time
went into (unsuccessful) proving. If the bound also stalled, the solution may well be optimal
but hard to prove.'''

[bound_stalled]           # fields: last_time, wall
fraction_of_walltime = 0.5
level = 'info'
title = 'Bound stalled early'
text = '''
The proven bound last improved at {last_time:.1f}s. Weak relaxations are typical for big-M
formulations; tighter constraints or redundant constraints for the LP can help.'''

[conflict_heavy]          # fields: worker, conflicts, branches
min_ratio = 0.5              # conflicts / branches of the worker with most conflicts
level = 'info'
title = 'Conflict-heavy search'
text = '''
Worker `{worker}` had {conflicts:,} conflicts for {branches:,} branches: it learned from most
decisions, a sign of a tightly constrained combinatorial core.'''

[feasible_descent]        # fields: worker, conflicts, branches
max_ratio = 0.05
level = 'info'
title = 'Mostly feasible descent'
text = '''
Worker `{worker}` had only {conflicts:,} conflicts for {branches:,} branches: the search
descends feasibly most of the time; difficulty lies in the optimization, not feasibility.'''

[per_worker_counters]     # fields: response_conflicts, max_conflicts
max_ratio = 0.1              # response conflicts / busiest worker's conflicts
level = 'info'
title = 'Summary counters are per worker'
text = '''
The summary reports {response_conflicts:,} conflicts while the busiest worker had
{max_conflicts:,}. The summary counters come from one worker only: the first one that finished
and was freed, often a first-solution worker such as `fs_random_no_lp`. They are not a
portfolio total. Use the Search stats table to judge the effort.'''

[lns_closed_quickly]      # fields: count, total
closed_percent = 80          # a neighborhood counts as "closed quickly" above this Closed value
min_rows = 3                 # at least this many rows, and at least half of all rows
level = 'info'
title = 'LNS neighborhoods closed quickly'
text = '''
Most LNS neighborhoods ({count} of {total}) were solved to completion; the sub-problems are
easy, so the difficulty is raised adaptively. Consider whether the solutions came mostly from
LNS (Solutions table) or from the exact workers.'''

[presolve_expanded]       # fields: initial, presolved
growth_factor = 2            # presolved variables > factor * initial variables ...
min_variables = 1000         # ... and more than this many presolved variables
level = 'info'
title = 'Presolve expanded the model'
text = '''
The presolved model has {presolved:,} variables versus {initial:,} initially. Presolve
expanded high-level constraints (e.g. AllDifferent, element, tables) into Booleans the
propagators understand; this is normal but shows where the search effort goes.'''

[objective_removed_by_presolve]   # fields: terms
level = 'info'
title = 'Presolve fixed the objective'
text = '''
The objective had {terms:,} variables in the initial model and none in the presolved one, so
presolve pinned its value to a constant and the search only had to find a matching solution.
This also reshapes the portfolio: every worker that works on the objective is gone (`core`,
`lb_tree_search`, `objective_lb_search`, `objective_shaving*`, `pseudo_costs`) and so is every
LNS neighborhood (`*_lns`), because a neighborhood needs an objective to improve. What runs
instead are the plain exact workers plus `ls`, `feasibility_pump` and `rins/rens`, and a
strategy may be repeated (`default_lp(2)`) to fill the worker budget. If such a run ends
UNKNOWN, the difficulty is pure feasibility, not optimization.'''

[presolve_shrank]         # fields: initial, presolved
shrink_factor = 0.5          # presolved variables < factor * initial variables
level = 'good'
title = 'Presolve shrank the model'
text = 'Presolve reduced the model from {initial:,} to {presolved:,} variables.'

# --- Quality of the log itself -----------------------------------------------
# These four rules are about the input rather than the solve. They are evaluated
# first so they appear at the top of the Overview: everything below them is
# derived from a log that is incomplete, cut off or partly unrecognized.

[not_a_cpsat_log]
level = 'bad'
title = 'This does not look like a CP-SAT log'
text = '''
Nothing that CP-SAT prints was found in this text - no solver header, no model, no search and
no response summary. Two common causes: the output of a different tool was pasted, or
`log_search_progress` was not enabled, in which case CP-SAT prints almost nothing. Set
`solver.parameters.log_search_progress = True` (and keep the default `log_to_stdout`) and run
again.'''

[log_truncated]           # fields: last_line
level = 'warn'
title = 'Log ends before the response summary'
text = '''
The log stops at line {last_line} without a `CpSolverResponse summary`, so the run was killed,
is still going, or the output was cut off. Status, objective, bound and wall time are unknown;
everything shown here is what the log contains up to that line.'''

[head_missing]
level = 'warn'
title = 'Beginning of the log is missing'
text = '''
The log starts after the solver header, so the OR-Tools version, the parameters you set and
the initial model are unknown, and the checks that depend on them are skipped. Paste the log
from the first `Starting CP-SAT solver` line on to get the full analysis.'''

[unrecognised_lines]      # fields: count, places, first_line
min_lines = 1                # any unrecognized line is worth reporting: healthy logs have none
level = 'warn'
title = 'Parts of the log were not recognized'
text = '''
{count} line(s) in {places} place(s) could not be assigned to any known section, starting at
line {first_line}; they are marked in the log on the right. Usually this is your own output
mixed into the log, a line-prefix added by a logging framework, or lines clipped by a
terminal. If it is plain CP-SAT output, the parser is missing a section - please report the
log.'''

# --- Solution hint -----------------------------------------------------------
# The hint is the caller's own input, so the log is the only place where they can
# see what CP-SAT made of it. Rules in insights.py::_insight_hint.

[hint_used]
level = 'good'
title = 'Hint used as the first solution'
text = '''
The solution hint was complete and feasible, and CP-SAT put it straight into the solution pool
as solution `#1` under the worker name `complete_hint`. Every worker started from that
incumbent, so the objective curve begins at your value instead of at the first solution the
portfolio could find on its own.'''

[hint_accepted]
level = 'good'
title = 'Hint complete and feasible'
text = '''
CP-SAT checked the hint and found it complete and feasible. Note that this line comes from the
check on the model *as given*; the solver checks again after presolve and only then adds the
hint to the solution pool (as `complete_hint`). No such solution appears in this log, so
either presolve changed the model in a way that broke the hint, or the run stopped before the
search started.'''

[hint_infeasible]
level = 'warn'
title = 'Hint is infeasible'
text = '''
The hint assigned every variable but the assignment violates a constraint, so CP-SAT could not
use it as a solution. It spends `hint_conflict_limit` conflicts trying to repair it
(`repair_hint`) and then searches normally. An infeasible hint is usually a mismatch between
the model you hinted and the model you solved - e.g. values from an earlier run whose
constraints have since changed. Set `debug_crash_on_bad_hint` while developing to find out
which constraint it breaks.'''

[hint_incomplete]         # fields: hinted, active
level = 'info'
title = 'Hint is incomplete'
text = '''
Only {hinted} of the {active} non-fixed variables were hinted, so the hint cannot be used as a
solution directly: CP-SAT follows it as a branching preference and searches for values for the
rest. That is a perfectly good way to use hints, but it does not give you a starting
incumbent - if you want one, hint every variable (typically by taking a full solution from an
earlier run) and check for the `complete_hint` solution in the search log.'''

[hint_outside_domain]
level = 'warn'
title = 'Hint outside the variable domains'
text = '''
The hint assigns a value that the variable's own domain does not contain, so it is ignored as a
solution. This is nearly always a stale hint: the domains were tightened (or the variables
rebuilt) after the values were produced.'''

[hint_breaks_assumptions]
level = 'warn'
title = 'Hint breaks the assumptions'
text = '''
The hint is a feasible solution of the model but contradicts one of the assumption literals of
this solve, so it cannot be used. Drop the assumptions or hint a solution that satisfies
them.'''

[hint_ignored]
level = 'info'
title = 'Hint ignored'
text = '''
The hint was dropped before the solve because the run set `cp_model_ignore_hints`. Nothing in
this log reflects your hinted values.'''

[hint_line_without_a_hint]
level = 'info'
title = 'The hint line here means nothing'
text = '''
`The solution hint is complete and is feasible.` also appears when **no** hint was given: the
check short-circuits on a model that has no non-fixed variables left, which is what happens
when presolve solves the model outright. Do not read this line as "my hint was accepted".'''
