[project]
name = "cpsatlog"
version = "0.1.0"
description = "Parse CP-SAT (OR-Tools) solver logs into line-anchored, JSON-serializable pydantic models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dominik Krupke" }]
keywords = ["cp-sat", "or-tools", "log", "parser", "pydantic"]
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty",
    "ortools>=9.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpsatlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
