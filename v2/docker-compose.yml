# CP-SAT Log Analyzer v2: `docker compose up --build` then open http://localhost:8080
services:
  backend:
    build:
      context: ..
      dockerfile: v2/backend/Dockerfile
    environment:
      CORS_ORIGINS: "*"
      # Deployment chrome: where "Report issue" points and the legal pages this
      # instance must show. Put them in a `.env` next to this file (see
      # `.env.example` and docs/deployment.md); empty means "not shown".
      ISSUE_URL: "${ISSUE_URL:-}"
      IMPRINT_URL: "${IMPRINT_URL:-}"
      IMPRINT_FILE: "${IMPRINT_FILE:-}"
      IMPRINT_LABEL: "${IMPRINT_LABEL:-}"
      PRIVACY_URL: "${PRIVACY_URL:-}"
      PRIVACY_FILE: "${PRIVACY_FILE:-}"
      PRIVACY_LABEL: "${PRIVACY_LABEL:-}"
    # Uncomment to serve the legal pages from Markdown files instead of linking
    # out, together with IMPRINT_FILE=/legal/imprint.md in your .env:
    # volumes:
    #   - ./legal:/legal:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
