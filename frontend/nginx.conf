server {
    listen 80;
    client_max_body_size 32m;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
    }
    # The bundle names carry a content hash, so they can be cached forever; the
    # entry point must not be, or a redeploy keeps serving the old app to anyone
    # who visited before (that is exactly what happened after the first rebuild).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
    }
}
