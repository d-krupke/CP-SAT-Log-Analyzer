[project]
name = "cpsat-log-analyzer-backend"
version = "2.0.0"
description = "FastAPI backend of the CP-SAT Log Analyzer: parses logs with cpsat-logutils and adds explanations."
requires-python = ">=3.12"
dependencies = [
    # The parser, developed in this project and published from
    # github.com/d-krupke/cpsat-logutils. Capped at the next major: the schema this
    # app reads (Loc, the section models, the block index) is that package's API.
    "cpsat-logutils>=1.0,<2",
    "fastapi>=0.115",
    # Imported directly (request/response models), not just pulled in by fastapi
    # and cpsat-logutils. Same floor as that package, whose models this app passes around.
    "pydantic>=2.10",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "ty",
]

# To develop against a local checkout of the parser instead of the release:
#   uv add --editable ../cpsat-logutils      (and revert before committing)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
