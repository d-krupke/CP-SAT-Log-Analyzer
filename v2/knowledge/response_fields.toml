# Explanations of the fields of the `CpSolverResponse summary:` section.

[response_fields]
status = '''
OPTIMAL: proven optimal (or feasible for satisfaction problems). FEASIBLE: a solution was
found but optimality not proven before the limit. INFEASIBLE: proven no solution. UNKNOWN:
neither a solution nor a proof. MODEL_INVALID: the model is broken.'''
objective = 'Objective value of the returned (best) solution.'
best_bound = '''
Best proven bound on the objective. The gap between objective and bound quantifies how far
the solution may be from optimal.'''
# The counters below belong to ONE worker, not to the portfolio. Each worker hands its
# statistics to the shared response manager when it is freed, and the summary merges only the
# first of those (synchronization.cc: `subsolver_responses_.front()`), i.e. the worker that
# finished first. Verified on 295 benchmark logs: that is a first-solution worker
# (`fs_random_no_lp`) in about half of the parallel runs, otherwise the worker that closed the
# search (`default_lp`, `no_lp`, ...); `main` in a single-worker run.
integers = "Integer variables in that worker's model."
booleans = '''
Boolean variables (incl. minted bound literals) of the worker whose statistics the summary
reports (the first worker to finish, not the whole portfolio).'''
conflicts = '''
Conflicts of the worker that finished first, not the portfolio total and not necessarily the
worker that found the solution. Often a first-solution worker such as `fs_random_no_lp`,
whose search stops as soon as a solution exists.'''
branches = '''
Decisions of that one worker, not the portfolio total.'''
propagations = 'Boolean propagations of that one worker.'
integer_propagations = 'Integer bound propagations of that one worker.'
restarts = 'Restarts of that one worker.'
lp_iterations = 'Simplex iterations of that one worker (0 if it ran without an LP).'
walltime = 'Total wall-clock time of the solve.'
usertime = '''
Meant to be the CPU time of the main thread; in the open-source build it is measured with the
wall-clock timer, so it usually equals `walltime`.'''
deterministic_time = 'Hardware-independent effort measure summed over workers.'
gap_integral = '''
Integral over deterministic time of log(1 + absolute objective gap), i.e. how long the
solver spent with a large bound-to-solution distance. Smaller means it converged faster;
useful to compare runs that end with the same status.'''
solution_fingerprint = 'Hash of the returned solution.'
lrat_status = '''
Status of LRAT proof logging (NA when not enabled). Printed as a separate line just before
the summary in newer versions.'''
