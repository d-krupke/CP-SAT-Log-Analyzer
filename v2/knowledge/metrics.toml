# Tiles of the Overview card: thresholds that colour a tile and the hint shown
# under it (or as tooltip). The values themselves are computed in
# v2/backend/app/metrics.py.

[version]
oldest_well_supported = '9.8'   # older versions get a warning
hint_old = '''
Old version: the log format differs and many newer improvements are missing. Consider
upgrading OR-Tools.'''

[workers]
min_for_full_portfolio = 8      # fewer workers -> warning
hint_few = 'With fewer than 8 workers only part of the portfolio runs (1 worker = default_lp only).'

[gap]
hint = '|objective - bound| / max(1, |objective|)'
warn_below_percent = 10         # gap below this: warn (yellow); above: bad (red); ~0: good

[presolve_time]
warn_share = 0.5                # presolve share of the wall time above which the tile warns
hint = 'Time from the start of presolve to the start of the search.'
hint_dominates = 'Presolve dominates the run time.'

[solutions]
hint = 'Improving solutions reported in the search log.'

[bound_events]
hint = 'Logged bound improvements (throttled by the solver).'
