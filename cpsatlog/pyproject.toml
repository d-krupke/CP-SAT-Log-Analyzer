[project]
name = "cpsatlog"
version = "0.1.0"
description = "Parse CP-SAT (OR-Tools) solver logs into line-anchored, JSON-serializable pydantic models."
readme = "README.md"
requires-python = ">=3.12"
# PEP 639: an SPDX expression plus the file itself, so the wheel carries the
# license text and not only the word "MIT". LICENSE is a copy of the repository's,
# because a package may not reach outside its own directory.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dominik Krupke" }]
keywords = ["cp-sat", "or-tools", "log", "parser", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
# Only pydantic, and 2.10 is a hard floor: the schema declares its generics with
# PEP 695 syntax (`class Loc[T](BaseModel)`), and pydantic accepts a `Loc[str]`
# instance where a `Loc[str]` is expected only from 2.10 on. Older versions parse
# simple logs but raise ValidationError as soon as a model holds `list[Loc[str]]`.
dependencies = ["pydantic>=2.10"]

[project.urls]
Homepage = "https://github.com/d-krupke/CP-SAT-Log-Analyzer"
Repository = "https://github.com/d-krupke/CP-SAT-Log-Analyzer"
Issues = "https://github.com/d-krupke/CP-SAT-Log-Analyzer/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Floors, not just names: `--resolution lowest-direct` (see ci.yml) would
    # otherwise reach for the first release ever published of an unpinned tool.
    "ty>=0.0.78",
    "ortools>=9.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpsatlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
